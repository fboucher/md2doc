<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>md2doc</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --error: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a 60%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.subtitle { margin: 0 0 24px; color: var(--muted); }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .dropzone strong { display: block; margin-bottom: 6px; }
    .dropzone span { color: var(--muted); font-size: .9rem; }
    .filename { margin-top: 14px; font-size: .9rem; color: var(--accent); word-break: break-all; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: #04293f;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: var(--accent-strong); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 16px; min-height: 1.2em; font-size: .9rem; }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    .status.busy { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>md2doc</h1>
    <p class="subtitle">Convert a Markdown file into a Word (.docx) document.</p>

    <div class="dropzone" id="dropzone">
      <strong>Drop your .md file here</strong>
      <span>or click to browse &middot; a single .md or a .zip (markdown + images) &middot; max 50 MB</span>
      <div class="filename" id="filename"></div>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.zip,text/markdown,application/zip" hidden />

    <button id="convertBtn" disabled>Convert to .docx</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const filenameEl = document.getElementById("filename");
    const convertBtn = document.getElementById("convertBtn");
    const statusEl = document.getElementById("status");

    let selectedFile = null;

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    const ZIP_RE = /\.(md|markdown|mdown|mkd|zip)$/i;

    function selectFile(file) {
      if (!file) return;
      if (!ZIP_RE.test(file.name)) {
        setStatus("Please choose a Markdown (.md) or ZIP (markdown + images) file.", "error");
        return;
      }
      selectedFile = file;
      filenameEl.textContent = file.name;
      convertBtn.disabled = false;
      setStatus("");
    }

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      selectFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      setStatus("Converting…", "busy");

      const body = new FormData();
      body.append("file", selectedFile);

      try {
        const response = await fetch("/convert", { method: "POST", body });
        if (!response.ok) {
          let detail = `Conversion failed (${response.status}).`;
          try {
            const data = await response.json();
            if (data && data.detail) detail = data.detail;
          } catch (_) { /* keep default message */ }
          throw new Error(detail);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = selectedFile.name.replace(/\.[^.]+$/, "") + ".docx";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        setStatus("Done — your .docx has been downloaded.", "success");
      } catch (err) {
        setStatus(err.message, "error");
      } finally {
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
